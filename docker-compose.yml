# Manak Setu — full stack in one command: docker compose up
# Services: postgres (records/rules) + qdrant (vectors) + neo4j (graph) + api (FastAPI)
# web (Next.js) is added in Week 5 of the build plan.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: manak
      POSTGRES_PASSWORD: manak
      POSTGRES_DB: manak_setu
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manak -d manak_setu"]
      interval: 5s
      timeout: 3s
      retries: 10

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: neo4j/manak_setu
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "7474:7474"   # browser UI
      - "7687:7687"   # bolt
    volumes:
      - neo4j_data:/data

  api:
    build: ./services/api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://manak:manak@postgres:5432/manak_setu
      QDRANT_URL: http://qdrant:6333
      NEO4J_URL: bolt://neo4j:7687
    volumes:
      - ./services/api:/app        # dev: code changes reflect without rebuild
      - ./data:/app/data           # crawler output visible inside container
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy

  # web:                      # <-- enabled in Week 5 (frontend)
  #   build: ./apps/web
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - api

volumes:
  pgdata:
  qdrant_data:
  neo4j_data:
