# Manak Setu — Domain Glossary v1
# Maps colloquial / Hinglish / trade terms to a concept + probable Indian Standards.
# Consumed by the query pre-processor (Week 3): expand user text → concept → IS hints,
# then re-rank by vector retrieval. Terms are matched case-insensitively, word-boundary.
# is_hints seed the search but retrieval decides the final set — never force these.

version: 1
locales: [en, hi, hinglish]
updated: 2026-10-04

